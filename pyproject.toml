[project]
name = "wpd-compstat"
version = "0.9.0"
description = "Warwick Police Department COMPSTAT Intelligence and Operational Management System"
requires-python = ">=3.12,<3.15"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore:The `fitz` API is deprecated:DeprecationWarning",
]
